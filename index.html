<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Courtroom: AI Justice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDKS -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Rajdhani', 'sans-serif'], comic: ['Bangers', 'cursive'] },
                    colors: { cyber: { cyan: '#00e5ff', blue: '#0044ff', red: '#ff003c', dark: '#050b14', panel: '#0a192f' } },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shake-hard': 'shakeHard 0.4s cubic-bezier(.36,.07,.19,.97) both',
                        'zoom-in-flash': 'zoomInFlash 0.5s ease-out forwards',
                        'slide-in-right': 'slideInRight 0.3s ease-out forwards',
                        'slide-in-left': 'slideInLeft 0.3s ease-out forwards',
                    },
                    keyframes: {
                        pulseGlow: { '0%, 100%': { filter: 'drop-shadow(0 0 5px rgba(0, 229, 255, 0.5))' }, '50%': { filter: 'drop-shadow(0 0 20px rgba(0, 229, 255, 1))' } },
                        shakeHard: { '0%, 100%': { transform: 'translate3d(0, 0, 0)' }, '10%, 30%, 50%, 70%, 90%': { transform: 'translate3d(-10px, 10px, 0) rotate(-2deg)' }, '20%, 40%, 60%, 80%': { transform: 'translate3d(10px, -10px, 0) rotate(2deg)' } },
                        zoomInFlash: { '0%': { opacity: '0', transform: 'scale(0.1) rotate(-15deg)' }, '50%': { opacity: '1', transform: 'scale(1.2) rotate(5deg)', filter: 'brightness(2)' }, '100%': { opacity: '1', transform: 'scale(1) rotate(0deg)', filter: 'brightness(1)' } },
                        slideInRight: { '0%': { opacity: '0', transform: 'translateX(50px)' }, '100%': { opacity: '1', transform: 'translateX(0)' } },
                        slideInLeft: { '0%': { opacity: '0', transform: 'translateX(-50px)' }, '100%': { opacity: '1', transform: 'translateX(0)' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000; color: #fff; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        .app-container { max-width: 480px; margin: 0 auto; height: 100dvh; background-color: #050b14; position: relative; overflow: hidden; box-shadow: 0 0 30px rgba(0,229,255,0.2); background-image: linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px); background-size: 20px 20px; display: flex; flex-direction: column; }
        .screen { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 10; }
        .screen.active { opacity: 1; pointer-events: auto; z-index: 20; }
        .cyber-dialog { background: rgba(10, 25, 47, 0.85); border: 1px solid #00e5ff; border-radius: 8px 24px 8px 8px; box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.2), 0 0 10px rgba(0, 229, 255, 0.1); position: relative; backdrop-filter: blur(4px); }
        .cyber-dialog::before { content: ''; position: absolute; top: -1px; left: -1px; width: 20px; height: 20px; border-top: 2px solid #00e5ff; border-left: 2px solid #00e5ff; border-radius: 8px 0 0 0; }
        .cyber-dialog.prosecutor { border-color: #ff003c; border-radius: 24px 8px 8px 8px; box-shadow: inset 0 0 10px rgba(255, 0, 60, 0.2), 0 0 10px rgba(255, 0, 60, 0.1); }
        .cyber-dialog.prosecutor::before { border-color: #ff003c; left: auto; right: -1px; border-left: none; border-right: 2px solid #ff003c; border-radius: 0 8px 0 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .character-portrait { filter: contrast(1.2) saturate(1.1) brightness(0.9); mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%); -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%); }
        .wooden-desk { background: linear-gradient(to bottom, #4a2e15 0%, #2a1608 100%); border-top: 3px solid #6b4423; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- LOBBY SCREEN -->
        <div id="screen-lobby" class="screen active bg-cyber-dark items-center justify-center p-6 overflow-y-auto">
            <div class="text-center animate-zoom-in-flash mb-6 mt-4">
                <i class="fa-solid fa-scale-balanced text-5xl text-cyber-cyan animate-pulse-glow mb-2 block"></i>
                <h1 class="text-4xl font-comic tracking-wider text-transparent bg-clip-text bg-gradient-to-b from-white to-cyber-cyan drop-shadow-[0_0_10px_rgba(0,229,255,0.8)]" style="-webkit-text-stroke: 1px #00e5ff;">AI COURTROOM</h1>
            </div>

            <div class="w-full max-w-sm space-y-4 bg-cyber-panel/80 p-5 rounded-xl border border-cyber-cyan/30 shadow-[0_0_20px_rgba(0,229,255,0.1)] backdrop-blur-md">
                
                <!-- NEW: Player Name Input -->
                <div>
                    <label class="block text-xs font-bold text-cyber-cyan uppercase tracking-wider mb-2">Your Name</label>
                    <input type="text" id="player-name" placeholder="E.g. Aniket" class="w-full bg-black border-2 border-cyber-cyan/50 rounded p-2 text-center text-lg font-bold text-white focus:outline-none focus:border-cyber-cyan transition-all capitalize" autocomplete="off">
                </div>

                <div>
                    <label class="block text-xs font-bold text-cyber-cyan uppercase tracking-wider mb-2">Room Code (Leave blank to Host)</label>
                    <input type="text" id="room-code" placeholder="ENTER 4 DIGITS" maxlength="4" class="w-full bg-black border-2 border-cyber-cyan/50 rounded p-2 text-center text-xl font-bold tracking-[0.5em] text-white focus:outline-none focus:border-cyber-cyan transition-all uppercase" autocomplete="off">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-cyber-cyan uppercase tracking-wider mb-2">Case Type (If Hosting)</label>
                    <select id="case-type" class="w-full bg-black border-2 border-cyber-cyan/50 rounded p-2 text-center text-sm font-bold text-white focus:outline-none focus:border-cyber-cyan appearance-none cursor-pointer">
                        <option value="cyber">💻 Cyber Crime (Digital Heist)</option>
                        <option value="murder">🔪 Murder Mystery (Midnight Shadow)</option>
                        <option value="fraud">💼 Corporate Fraud (Phantom Shares)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-cyber-cyan uppercase tracking-wider mb-2">Select Side</label>
                    <select id="player-role" class="w-full bg-black border-2 border-cyber-cyan/50 rounded p-2 text-center text-lg font-bold text-white focus:outline-none focus:border-cyber-cyan appearance-none cursor-pointer">
                        <option value="Defense">DEFENSE (Blue)</option>
                        <option value="Prosecutor">PROSECUTOR (Red)</option>
                    </select>
                </div>
                
                <button onclick="gameApp.joinGame()" class="w-full bg-gradient-to-r from-cyber-blue to-cyber-cyan hover:from-cyber-cyan hover:to-white text-black font-black text-xl py-3 mt-2 rounded shadow-[0_0_20px_rgba(0,229,255,0.6)] transition-all transform hover:scale-[1.02] active:scale-95 uppercase tracking-wider">
                    Enter Court
                </button>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="screen-game" class="screen flex flex-col h-full bg-black">
            
            <!-- SECTION 1: AI JUDGE -->
            <div class="h-[28%] relative bg-[url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=600&auto=format&fit=crop')] bg-cover bg-center border-b-4 border-cyber-cyan">
                <div class="absolute inset-0 bg-gradient-to-b from-black/80 via-cyber-dark/60 to-black/90"></div>
                
                <div class="absolute inset-0 flex flex-col items-center justify-end pb-4">
                    <i class="fa-solid fa-scale-unbalanced text-3xl text-cyber-cyan animate-pulse-glow mb-2 drop-shadow-[0_0_10px_#00e5ff]"></i>
                    
                    <div class="relative w-24 h-24 rounded-full overflow-hidden border-2 border-cyber-cyan shadow-[0_0_20px_#00e5ff] z-10 mb-2">
                        <img src="https://images.unsplash.com/photo-1535223289827-42f1e9919769?q=80&w=200&auto=format&fit=crop" class="object-cover w-full h-full mix-blend-luminosity filter sepia-[0.5] hue-rotate-180" alt="AI Judge">
                        <div class="absolute inset-0 bg-cyber-cyan/20 animate-pulse"></div>
                    </div>
                    
                    <div class="bg-black/80 border border-cyber-cyan px-4 py-1 rounded text-xs font-bold text-cyber-cyan uppercase tracking-widest relative z-10 mb-3 shadow-[0_0_10px_#00e5ff]">
                        MILORD AI-7
                    </div>

                    <div class="w-11/12 max-w-[300px] relative z-10">
                        <div class="flex justify-between text-[10px] font-bold uppercase mb-1 drop-shadow-md">
                            <span class="text-cyber-red" id="scale-prosecutor-label">Prosecution</span>
                            <span class="text-cyber-cyan" id="scale-defense-label">Defense</span>
                        </div>
                        <div class="h-3 w-full bg-gray-900 rounded-full border border-gray-600 overflow-hidden relative shadow-[0_0_10px_rgba(255,255,255,0.1)]">
                            <div id="verdict-bar" class="absolute left-0 top-0 h-full w-[50%] bg-gradient-to-r from-cyber-red to-cyber-cyan transition-all duration-500 ease-out"></div>
                            <div class="absolute left-1/2 top-0 bottom-0 w-0.5 bg-white shadow-[0_0_5px_#fff] -ml-[1px]"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECTION 2: CHARACTERS -->
            <div class="h-[35%] relative flex border-b-2 border-gray-800 bg-cyber-panel overflow-hidden">
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-12 h-12 bg-black border-2 border-white rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(255,255,255,0.5)] transform -rotate-12 italic font-black text-2xl">VS</div>

                <div id="zone-prosecutor" class="w-1/2 relative bg-gradient-to-br from-red-950 to-black border-r-2 border-red-900/50 flex flex-col justify-end transition-opacity duration-300 opacity-50">
                    <div class="absolute top-2 left-2 z-20 flex flex-col gap-1">
                        <div class="bg-cyber-red text-black text-[10px] font-black px-2 py-0.5 uppercase border border-red-400 drop-shadow-[0_0_5px_#ff003c]" id="label-prosecutor">Prosecutor</div>
                        <div class="text-white text-xs font-bold drop-shadow-md" id="prosecutor-status">Waiting...</div>
                    </div>
                    <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=300&auto=format&fit=crop" class="character-portrait absolute bottom-[30px] left-0 h-[120%] object-cover object-top opacity-90" alt="Prosecutor">
                    <div class="wooden-desk absolute bottom-0 left-0 w-full h-[40px] z-10"></div>
                </div>

                <div id="zone-defense" class="w-1/2 relative bg-gradient-to-bl from-cyan-950 to-black flex flex-col justify-end transition-opacity duration-300 opacity-100">
                    <div class="absolute top-2 right-2 z-20 flex flex-col gap-1 items-end">
                        <div class="bg-cyber-cyan text-black text-[10px] font-black px-2 py-0.5 uppercase border border-cyan-400 drop-shadow-[0_0_5px_#00e5ff]" id="label-defense">Defense</div>
                        <div class="text-white text-xs font-bold drop-shadow-md" id="defense-status"><i class="fa-solid fa-microphone text-green-400 animate-pulse"></i> Speaking</div>
                    </div>
                    <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=300&auto=format&fit=crop" class="character-portrait absolute bottom-[30px] right-0 h-[120%] object-cover object-top opacity-90 transform -scale-x-100" alt="Defense">
                    <div class="wooden-desk absolute bottom-0 right-0 w-full h-[40px] z-10"></div>
                </div>
            </div>

            <!-- SECTION 3: CHAT AREA & CONTROLS -->
            <div class="h-[37%] flex flex-col relative bg-cyber-dark">
                <div id="chat-container" class="flex-1 overflow-y-auto p-3 space-y-4 no-scrollbar pb-16">
                    <div class="text-center">
                        <span class="bg-black border border-gray-700 text-gray-400 text-[10px] uppercase tracking-widest px-3 py-1 rounded-full">Trial Commences</span>
                    </div>
                </div>

                <button onclick="gameApp.callVerdict()" class="absolute -top-8 left-4 z-30 w-16 h-16 bg-gradient-to-br from-blue-500 to-blue-700 border-2 border-white rounded-full shadow-[0_0_20px_#0044ff,inset_0_0_10px_rgba(0,0,0,0.5)] flex items-center justify-center transform hover:scale-110 active:scale-90 transition-all text-white text-2xl group">
                    <i class="fa-solid fa-gavel drop-shadow-md"></i>
                </button>

                <button onclick="gameApp.triggerObjection()" class="absolute -top-8 right-4 z-30 w-16 h-16 bg-gradient-to-br from-red-500 to-red-700 border-2 border-white rounded-full shadow-[0_0_20px_#ff003c,inset_0_0_10px_rgba(0,0,0,0.5)] flex items-center justify-center transform hover:scale-110 active:scale-90 transition-all font-comic text-white text-xl italic tracking-tighter overflow-hidden group">
                    <span class="absolute inset-0 bg-white opacity-0 group-hover:opacity-30 group-active:opacity-50 transition-opacity"></span>
                    <i class="fa-solid fa-hand-paper drop-shadow-md"></i>
                </button>

                <div class="bg-cyber-panel/90 border-t border-cyber-cyan p-2 backdrop-blur-sm z-20 flex flex-col">
                    <div class="flex justify-between items-center mb-2 px-1">
                        <span class="text-[10px] text-cyber-cyan font-bold uppercase">🎙️ Voice Input Lang:</span>
                        <select id="voice-lang" class="bg-black text-white text-xs border border-cyber-cyan rounded px-2 py-1 outline-none">
                            <option value="en-US">English</option>
                            <option value="hi-IN">Hindi / Hinglish</option>
                        </select>
                    </div>

                    <form id="argument-form" onsubmit="gameApp.sendArgument(event)" class="flex gap-2">
                        <button type="button" id="mic-btn" onclick="gameApp.toggleMic()" class="bg-gray-800 text-white px-3 py-2 rounded shadow-md active:scale-95 transition-all">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                        <input type="text" id="argument-input" placeholder="Type or speak argument..." class="flex-1 bg-black border border-gray-600 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyber-cyan focus:shadow-[0_0_10px_rgba(0,229,255,0.3)] transition-all font-sans font-medium" autocomplete="off">
                        <button type="submit" id="send-btn" class="bg-cyber-cyan text-black px-4 py-2 rounded font-bold uppercase tracking-wider active:scale-95 transition-transform hover:bg-white hover:shadow-[0_0_15px_#00e5ff]">
                            <i class="fa-solid fa-play"></i>
                        </button>
                    </form>
                </div>
            </div>

            <!-- OBJECTION OVERLAY -->
            <div id="objection-overlay" class="absolute inset-0 bg-red-900/40 z-50 hidden flex-col items-center justify-center pointer-events-none overflow-hidden">
                <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-transparent via-transparent to-red-900/80 animate-pulse"></div>
                <div id="objection-text" class="relative z-10 opacity-0 transform scale-0 font-comic text-7xl md:text-8xl italic font-black tracking-tighter text-white drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)]" style="-webkit-text-stroke: 3px #ff003c;">
                    OBJECTION!
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full bg-yellow-400 rounded-[50%] blur-[20px] -z-10 mix-blend-overlay"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE INITIALIZATION ---
        const firebaseConfig = {
          apiKey: "AIzaSyCz9JOBFR95P9t0cjeT-WYbd90qEBkqRHU",
          authDomain: "virtualcourt.firebaseapp.com",
          databaseURL: "https://virtualcourt-default-rtdb.firebaseio.com",
          projectId: "virtualcourt",
          storageBucket: "virtualcourt.firebasestorage.app",
          messagingSenderId: "265909339916",
          appId: "1:265909339916:web:66401e1630f014a7b46b29"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- 2. GAME LOGIC ---
        const gameApp = {
            roomCode: '',
            myRole: 'Defense',
            myName: '', // NEW: Store Advocate Name
            currentTurn: 'Defense',
            
            recognition: null,
            isListening: false,
            
            ui: {
                lobby: document.getElementById('screen-lobby'),
                game: document.getElementById('screen-game'),
                chat: document.getElementById('chat-container'),
                input: document.getElementById('argument-input'),
                sendBtn: document.getElementById('send-btn'),
                zoneP: document.getElementById('zone-prosecutor'),
                zoneD: document.getElementById('zone-defense'),
                statusP: document.getElementById('prosecutor-status'),
                statusD: document.getElementById('defense-status'),
                labelP: document.getElementById('label-prosecutor'),
                labelD: document.getElementById('label-defense'),
                objOverlay: document.getElementById('objection-overlay'),
                objText: document.getElementById('objection-text')
            },

            joinGame: function() {
                const codeInput = document.getElementById('room-code').value;
                this.myRole = document.getElementById('player-role').value;
                
                // NEW: Logic to add "Adv." automatically
                let rawName = document.getElementById('player-name').value.trim();
                if(!rawName) rawName = "Lawyer"; 
                this.myName = "Adv. " + rawName;
                
                this.initSpeech();
                
                if(codeInput.length === 0) {
                    this.roomCode = Math.floor(1000 + Math.random() * 9000).toString();
                    
                    const caseType = document.getElementById('case-type').value;
                    let dummyCaseDetails = {};
                    if(caseType === 'murder') {
                        dummyCaseDetails = { title: "The Midnight Shadow", police_report: "Mansion ke band library me ek murder hua hai. Koi hathiyar nahi mila." };
                    } else if (caseType === 'fraud') {
                        dummyCaseDetails = { title: "The Phantom Shares", police_report: "Company ke accounts se $10 Million achanak gayab ho gaye. CEO suspect hai." };
                    } else {
                        dummyCaseDetails = { title: "The Digital Heist", police_report: "Raat 2 baje bank ka server hack hua. Police ne server admin ko arrest kiya hai." };
                    }
                    db.ref('courtrooms/' + this.roomCode + '/case_details').set(dummyCaseDetails);
                    alert(`ROOM CREATED!\n\nYour Room Code is: ${this.roomCode}\nShare this code with your opponent.`);
                } else {
                    this.roomCode = codeInput;
                }
                
                // Set Local Names Immediately
                if(this.myRole === 'Defense') {
                    this.ui.labelD.innerText = this.myName + ' (You)';
                    this.ui.labelP.innerText = 'Prosecutor (Waiting...)';
                } else {
                    this.ui.labelP.innerText = this.myName + ' (You)';
                    this.ui.labelD.innerText = 'Defense (Waiting...)';
                }

                // Register name in Firebase so opponent can see it
                db.ref('courtrooms/' + this.roomCode + '/players/' + this.myRole).set(this.myName);

                this.ui.lobby.classList.remove('active');
                this.ui.game.classList.add('active');
                this.updateTurnVisuals();
                this.initFirebase();
            },

            initSpeech: function() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if(SpeechRecognition) {
                    this.recognition = new SpeechRecognition();
                    this.recognition.continuous = false;
                    this.recognition.interimResults = false;
                    
                    this.recognition.onstart = () => {
                        this.isListening = true;
                        const micBtn = document.getElementById('mic-btn');
                        micBtn.classList.remove('text-white', 'bg-gray-800');
                        micBtn.classList.add('text-red-500', 'bg-red-900', 'animate-pulse');
                        this.ui.input.placeholder = "Listening...";
                    };
                    
                    this.recognition.onresult = (event) => {
                        this.ui.input.value += (this.ui.input.value ? ' ' : '') + event.results[0][0].transcript;
                    };
                    
                    this.recognition.onerror = () => this.resetMicUI();
                    this.recognition.onend = () => this.resetMicUI();
                }
            },

            toggleMic: function() {
                if(!this.recognition) return alert("Aapka browser Voice Typing support nahi karta (Chrome use karein).");
                if(this.isListening) {
                    this.recognition.stop();
                } else {
                    this.recognition.lang = document.getElementById('voice-lang').value;
                    this.recognition.start();
                }
            },

            resetMicUI: function() {
                this.isListening = false;
                const micBtn = document.getElementById('mic-btn');
                if(micBtn) {
                    micBtn.classList.remove('text-red-500', 'bg-red-900', 'animate-pulse');
                    micBtn.classList.add('text-white', 'bg-gray-800');
                }
                this.ui.input.placeholder = this.currentTurn === this.myRole ? "Type or speak argument..." : "Waiting for opponent...";
            },

            initFirebase: function() {
                db.ref('courtrooms/' + this.roomCode + '/case_details').once('value', (snapshot) => {
                    const caseData = snapshot.val();
                    if(caseData) alert(`📜 CASE BRIEFING:\n\nTitle: ${caseData.title}\n\nReport: ${caseData.police_report}`);
                });

                // NEW: Listen for Opponent's Name
                db.ref('courtrooms/' + this.roomCode + '/players').on('value', (snapshot) => {
                    const players = snapshot.val();
                    if(players) {
                        if(this.myRole === 'Defense' && players.Prosecutor) {
                            this.ui.labelP.innerText = players.Prosecutor + ' (Opponent)';
                        } else if(this.myRole === 'Prosecutor' && players.Defense) {
                            this.ui.labelD.innerText = players.Defense + ' (Opponent)';
                        }
                    }
                });

                db.ref('courtrooms/' + this.roomCode + '/arguments').on('child_added', (snapshot) => {
                    const msg = snapshot.val();
                    // Pass name to dialog
                    const senderName = msg.name || `Adv. ${msg.role}`;
                    this.appendDialog(msg.role, senderName, msg.text, msg.isObjection);
                    this.currentTurn = msg.role === 'Defense' ? 'Prosecutor' : 'Defense';
                    this.updateTurnVisuals();
                });
            },

            updateTurnVisuals: function() {
                const isMyTurn = this.currentTurn === this.myRole;
                this.ui.input.disabled = !isMyTurn;
                this.ui.sendBtn.disabled = !isMyTurn;
                
                if(isMyTurn) {
                    this.ui.input.placeholder = "Type or speak argument...";
                    this.ui.input.focus();
                } else {
                    this.ui.input.placeholder = "Waiting for opponent...";
                }

                if(this.currentTurn === 'Defense') {
                    this.ui.zoneD.classList.replace('opacity-50', 'opacity-100');
                    this.ui.zoneP.classList.replace('opacity-100', 'opacity-50');
                    this.ui.statusD.innerHTML = '<i class="fa-solid fa-microphone text-green-400 animate-pulse"></i> Speaking';
                    this.ui.statusP.innerText = 'Waiting...';
                } else {
                    this.ui.zoneP.classList.replace('opacity-50', 'opacity-100');
                    this.ui.zoneD.classList.replace('opacity-100', 'opacity-50');
                    this.ui.statusP.innerHTML = '<i class="fa-solid fa-microphone text-green-400 animate-pulse"></i> Speaking';
                    this.ui.statusD.innerText = 'Waiting...';
                }
            },

            sendArgument: function(e) {
                e.preventDefault();
                if(!this.ui.input.value.trim() || this.currentTurn !== this.myRole) return;
                
                const text = this.ui.input.value.trim();
                this.ui.input.value = '';

                // NEW: Send the name along with the text
                db.ref('courtrooms/' + this.roomCode + '/arguments').push({
                    role: this.myRole,
                    name: this.myName,
                    text: text,
                    isObjection: false,
                    timestamp: Date.now()
                });
            },

            triggerObjection: function() {
                this.ui.objOverlay.classList.remove('hidden');
                this.ui.objOverlay.classList.add('flex', 'animate-shake-hard');
                this.ui.objText.classList.remove('opacity-0', 'scale-0');
                this.ui.objText.classList.add('animate-zoom-in-flash');
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

                setTimeout(() => {
                    this.ui.objOverlay.classList.add('hidden');
                    this.ui.objOverlay.classList.remove('flex', 'animate-shake-hard');
                    this.ui.objText.classList.add('opacity-0', 'scale-0');
                    this.ui.objText.classList.remove('animate-zoom-in-flash');
                    
                    db.ref('courtrooms/' + this.roomCode + '/arguments').push({
                        role: this.myRole,
                        name: this.myName,
                        text: "OBJECTION!",
                        isObjection: true,
                        timestamp: Date.now()
                    });
                }, 1200);
            },

            callVerdict: function() {
                this.appendDialog('judge', 'AI Judge', "MILORD AI-7 is processing the arguments... Please wait.");
                setTimeout(() => {
                    alert("⚖️ VERDICT: AI JUDGE HAS RULED!\n\nReason: The provided evidences strongly outweigh the opponent's counter-arguments.");
                }, 2500);
            },

            // NEW: Added playerName parameter
            appendDialog: function(role, playerName, text, isObjection = false) {
                const wrapper = document.createElement('div');
                
                if(role === 'judge') {
                    wrapper.className = "flex justify-center my-2 animate-slide-in-right";
                    wrapper.innerHTML = `
                        <div class="bg-black/60 border border-cyber-cyan px-4 py-2 rounded text-center max-w-[80%] shadow-[0_0_15px_rgba(0,229,255,0.2)]">
                            <p class="text-xs font-bold text-cyber-cyan uppercase tracking-widest mb-1"><i class="fa-solid fa-gavel"></i> ${playerName}</p>
                            <p class="text-sm text-gray-200 font-medium">${text}</p>
                        </div>
                    `;
                } else {
                    const isProsecutor = role === 'Prosecutor';
                    const isMe = role === this.myRole;
                    const alignClass = isMe ? (this.myRole === 'Prosecutor' ? 'self-start' : 'self-end') : (role === 'Prosecutor' ? 'self-start' : 'self-end');
                    const animationClass = role === 'Prosecutor' ? 'animate-slide-in-left' : 'animate-slide-in-right';
                    const boxClass = isProsecutor ? 'cyber-dialog prosecutor' : 'cyber-dialog';
                    const textColor = isProsecutor ? 'text-cyber-red' : 'text-cyber-cyan';
                    
                    let content = text;
                    if(isObjection) {
                        content = `<span class="font-comic text-2xl tracking-wide uppercase" style="color: ${isProsecutor ? '#ff003c' : '#00e5ff'}; text-shadow: 2px 2px 0px #000;">${text}</span>`;
                    }

                    wrapper.className = `flex flex-col w-[85%] ${alignClass} ${animationClass} mb-2`;
                    wrapper.innerHTML = `
                        <span class="text-[10px] font-bold uppercase ${textColor} mb-1 px-1 drop-shadow-md">${playerName} | ${role} ${isMe ? '(You)' : ''}</span>
                        <div class="${boxClass} p-3 text-sm text-white font-medium leading-snug">
                            ${content}
                        </div>
                    `;
                }
                this.ui.chat.appendChild(wrapper);
                this.ui.chat.scrollTop = this.ui.chat.scrollHeight;
            }
        };
    </script>
</body>
</html>
