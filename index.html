<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Courtroom: Anime Justice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- FIREBASE SDKS -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Roboto', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    colors: { 
                        court: { gold: '#D4AF37', dark: '#1a1a1a', wood: '#2C1E16', blue: '#1E3A8A', red: '#7F1D1D' } 
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'slide-down': 'slideDown 0.3s ease-out forwards',
                        'gavel-strike': 'gavelStrike 0.5s cubic-bezier(.36,.07,.19,.97) both',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideDown: { '0%': { opacity: '0', transform: 'translateY(-20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        gavelStrike: { '0%': { transform: 'rotate(-45deg)' }, '50%': { transform: 'rotate(20deg)' }, '100%': { transform: 'rotate(0deg)' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000; color: #fff; -webkit-tap-highlight-color: transparent; overflow: hidden; }
        .app-container { max-width: 480px; margin: 0 auto; height: 100dvh; background-color: #1a1a1a; position: relative; overflow: hidden; box-shadow: 0 0 30px rgba(212,175,55,0.1); display: flex; flex-direction: column; }
        .screen { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 10; }
        .screen.active { opacity: 1; pointer-events: auto; z-index: 20; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .character-portrait { mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%); -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%); object-fit: contain; }
        .wood-panel { background: url('https://images.unsplash.com/photo-1546484396-fb3fc6f95f98?q=80&w=600&auto=format&fit=crop') center/cover; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- LOBBY SCREEN -->
        <div id="screen-lobby" class="screen active wood-panel items-center justify-center p-6 overflow-y-auto">
            <div class="absolute inset-0 bg-black/70"></div>
            
            <div class="relative z-10 text-center mb-6 mt-4">
                <i class="fa-solid fa-scale-balanced text-5xl text-court-gold mb-2 block drop-shadow-md"></i>
                <h1 class="text-4xl font-serif tracking-wider text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">ANIME COURT</h1>
                <p class="text-gray-300 tracking-widest uppercase text-xs mt-1 font-bold">The Digital Justice</p>
            </div>

            <div class="relative z-10 w-full max-w-sm space-y-4 bg-black/60 p-5 rounded-xl border border-court-gold/30 shadow-2xl backdrop-blur-md">
                <div>
                    <label class="block text-xs font-bold text-court-gold uppercase tracking-wider mb-1">Advocate Name</label>
                    <input type="text" id="player-name" placeholder="E.g. Aniket" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-center text-lg font-bold text-white focus:border-court-gold transition-all capitalize" autocomplete="off">
                </div>

                <div>
                    <label class="block text-xs font-bold text-court-gold uppercase tracking-wider mb-1">Room Code (Blank to Host)</label>
                    <input type="text" id="room-code" placeholder="5 DIGIT CODE" maxlength="5" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-center text-xl font-bold tracking-[0.5em] text-white focus:border-court-gold transition-all uppercase" autocomplete="off">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-court-gold uppercase tracking-wider mb-1">Select Case (If Hosting)</label>
                    <select id="case-type" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-center text-sm font-bold text-white focus:border-court-gold">
                        <option value="cyber">💻 Cyber Heist: The Missing $5M</option>
                        <option value="murder">🔪 Mansion Murder: The Silent Night</option>
                        <option value="fraud">💼 Corporate Fraud: Phantom Shares</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-court-gold uppercase tracking-wider mb-1">Select Side</label>
                    <select id="player-role" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-center text-lg font-bold text-white focus:border-court-gold">
                        <option value="Defense">🛡️ DEFENSE (Blue Suit)</option>
                        <option value="Prosecutor">⚖️ PROSECUTOR (Red Suit)</option>
                    </select>
                </div>
                
                <button onclick="gameApp.joinGame()" class="w-full bg-court-gold hover:bg-yellow-500 text-black font-black text-xl py-3 mt-2 rounded shadow-lg transition-transform transform hover:scale-[1.02] active:scale-95 uppercase tracking-wider font-serif">
                    Enter Courtroom
                </button>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="screen-game" class="screen flex flex-col h-full bg-gray-900">
            
            <!-- TOP BAR -->
            <div class="h-[8%] bg-black border-b border-gray-700 flex justify-between items-center px-3 z-30 shadow-md">
                <div class="flex gap-2">
                    <button onclick="gameApp.showCaseFile()" class="bg-gray-800 hover:bg-gray-700 text-court-gold border border-gray-600 px-3 py-1 rounded text-xs font-bold uppercase transition-colors">
                        <i class="fa-solid fa-folder-open mr-1"></i> Case File
                    </button>
                    <button onclick="gameApp.showWitnesses()" class="bg-gray-800 hover:bg-gray-700 text-court-gold border border-gray-600 px-3 py-1 rounded text-xs font-bold uppercase transition-colors">
                        <i class="fa-solid fa-users mr-1"></i> Witnesses
                    </button>
                </div>
                <button onclick="gameApp.leaveRoom()" class="text-red-500 hover:text-red-400 font-bold text-sm uppercase">
                    <i class="fa-solid fa-door-open"></i> Leave
                </button>
            </div>

            <!-- SECTION 1: ANIME JUDGE -->
            <div class="h-[25%] relative wood-panel bg-center border-b-4 border-court-gold">
                <div class="absolute inset-0 bg-black/60"></div>
                
                <div class="absolute inset-0 flex flex-col items-center justify-end pb-2">
                    <i id="judge-gavel" class="fa-solid fa-gavel text-3xl text-court-gold mb-1 drop-shadow-md origin-bottom-right"></i>
                    
                    <div class="relative w-20 h-20 rounded-full overflow-hidden border-2 border-court-gold shadow-[0_0_15px_#D4AF37] z-10 mb-1 bg-white">
                        <img src="https://wsrv.nl/?url=upload.wikimedia.org/wikipedia/en/7/75/Judge_%28Ace_Attorney%29.png" class="object-cover w-full h-full transform scale-110" alt="Anime Judge">
                    </div>
                    
                    <div class="bg-black/80 border border-court-gold px-3 py-0.5 rounded text-[10px] font-bold text-court-gold uppercase tracking-widest relative z-10 mb-2 shadow-md">
                        HON. MILORD AI-7
                    </div>

                    <div class="w-11/12 max-w-[300px] relative z-10 text-center">
                        <p class="text-[10px] text-gray-300 font-bold uppercase mb-1" id="argument-counter">Arguments: 0 / 6 until Verdict</p>
                        <div class="h-1.5 w-full bg-gray-800 rounded-full overflow-hidden">
                            <div id="progress-bar" class="h-full bg-court-gold transition-all duration-500" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECTION 2: ANIME CHARACTERS -->
            <div class="h-[30%] relative flex border-b-2 border-gray-800 bg-gray-900 overflow-hidden">
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20 flex flex-col items-center transition-all" id="center-display">
                    <div class="w-10 h-10 bg-black border border-gray-600 rounded-full flex items-center justify-center shadow-lg font-serif italic font-black text-xl text-gray-400">VS</div>
                </div>

                <div id="zone-prosecutor" class="w-1/2 relative bg-gradient-to-br from-red-900/30 to-black border-r border-gray-800 flex flex-col justify-end transition-opacity duration-300 opacity-50">
                    <div class="absolute top-2 left-2 z-20 flex flex-col gap-1">
                        <div class="bg-red-700 text-white text-[9px] font-bold px-2 py-0.5 rounded uppercase" id="label-prosecutor">Prosecutor</div>
                        <div class="text-gray-300 text-[10px] font-bold" id="prosecutor-status">Waiting...</div>
                    </div>
                    <img src="https://wsrv.nl/?url=upload.wikimedia.org/wikipedia/en/5/53/Miles_Edgeworth.png" class="character-portrait absolute bottom-0 left-0 w-full h-[95%]" alt="Anime Prosecutor">
                </div>

                <div id="zone-defense" class="w-1/2 relative bg-gradient-to-bl from-blue-900/30 to-black flex flex-col justify-end transition-opacity duration-300 opacity-100">
                    <div class="absolute top-2 right-2 z-20 flex flex-col gap-1 items-end">
                        <div class="bg-blue-700 text-white text-[9px] font-bold px-2 py-0.5 rounded uppercase" id="label-defense">Defense</div>
                        <div class="text-green-400 text-[10px] font-bold animate-pulse" id="defense-status"><i class="fa-solid fa-microphone"></i> Speaking</div>
                    </div>
                    <img src="https://wsrv.nl/?url=upload.wikimedia.org/wikipedia/en/3/3b/Phoenix_Wright.png" class="character-portrait absolute bottom-0 right-0 w-full h-[95%] transform -scale-x-100" alt="Anime Defense">
                </div>
            </div>

            <!-- SECTION 3: CHAT AREA & CONTROLS -->
            <div class="h-[37%] flex flex-col relative bg-[#111]">
                <div id="chat-container" class="flex-1 overflow-y-auto p-3 flex flex-col gap-3 no-scrollbar pb-2">
                </div>

                <div class="bg-gray-900 border-t border-gray-700 p-2 z-20 flex flex-col">
                    <div class="flex justify-between items-center mb-2 px-1">
                        <span class="text-[10px] text-gray-400 font-bold uppercase">🎙️ Voice Lang:</span>
                        <select id="voice-lang" class="bg-black text-gray-300 text-[10px] border border-gray-700 rounded px-1 outline-none">
                            <option value="en-US">English</option>
                            <option value="hi-IN">Hindi/Hinglish</option>
                        </select>
                    </div>

                    <form id="argument-form" onsubmit="gameApp.sendArgument(event)" class="flex gap-2">
                        <button type="button" id="mic-btn" onclick="gameApp.toggleMic()" class="bg-gray-800 text-gray-300 px-3 py-2 rounded border border-gray-700 active:scale-95 transition-all">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                        <input type="text" id="argument-input" placeholder="Present your argument..." class="flex-1 bg-black border border-gray-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-court-gold transition-all" autocomplete="off">
                        <button type="submit" id="send-btn" class="bg-court-gold text-black px-4 py-2 rounded font-bold uppercase tracking-wider active:scale-95 transition-transform">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- MODALS -->
        <div id="modal-casefile" class="absolute inset-0 bg-black/80 z-50 hidden flex-col items-center justify-center p-4">
            <div class="bg-gray-100 w-full max-w-sm rounded-lg overflow-hidden shadow-2xl animate-slide-down text-black">
                <div class="bg-gray-800 text-court-gold p-3 flex justify-between items-center">
                    <h3 class="font-serif font-bold text-lg"><i class="fa-solid fa-folder-open"></i> CASE FILE</h3>
                    <button onclick="gameApp.closeModals()" class="text-white hover:text-red-500"><i class="fa-solid fa-times text-xl"></i></button>
                </div>
                <div class="p-4 space-y-3 font-sans text-sm h-64 overflow-y-auto">
                    <div>
                        <p class="font-bold text-gray-500 uppercase text-xs">Case Title</p>
                        <p class="font-bold text-lg text-blue-900" id="modal-casetitle">Loading...</p>
                    </div>
                    <hr>
                    <div>
                        <p class="font-bold text-gray-500 uppercase text-xs">Official Report (FIR)</p>
                        <p class="text-gray-800 mt-1" id="modal-casereport">Please wait, fetching details...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="modal-witnesses" class="absolute inset-0 bg-black/80 z-50 hidden flex-col items-center justify-center p-4">
            <div class="bg-gray-900 w-full max-w-sm rounded-lg overflow-hidden shadow-2xl animate-slide-down border border-gray-700">
                <div class="bg-black text-white p-3 flex justify-between items-center border-b border-gray-700">
                    <h3 class="font-serif font-bold text-lg"><i class="fa-solid fa-users text-court-gold"></i> CALL TO STAND</h3>
                    <button onclick="gameApp.closeModals()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button>
                </div>
                <div class="p-4 space-y-2 h-64 overflow-y-auto" id="witness-list">
                    <p class="text-gray-400 text-center mt-10">Loading witnesses...</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. FIREBASE INITIALIZATION ---
        const firebaseConfig = {
          apiKey: "AIzaSyCz9JOBFR95P9t0cjeT-WYbd90qEBkqRHU",
          authDomain: "virtualcourt.firebaseapp.com",
          databaseURL: "https://virtualcourt-default-rtdb.firebaseio.com",
          projectId: "virtualcourt",
          storageBucket: "virtualcourt.firebasestorage.app",
          messagingSenderId: "265909339916",
          appId: "1:265909339916:web:66401e1630f014a7b46b29"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // --- 2. GAME LOGIC ---
        const gameApp = {
            roomCode: '',
            myRole: 'Defense',
            myName: '',
            currentTurn: 'Defense',
            argumentCount: 0,
            maxArguments: 6,
            recognition: null,
            isListening: false,
            
            ui: {
                lobby: document.getElementById('screen-lobby'),
                game: document.getElementById('screen-game'),
                chat: document.getElementById('chat-container'),
                input: document.getElementById('argument-input'),
                sendBtn: document.getElementById('send-btn'),
                zoneP: document.getElementById('zone-prosecutor'),
                zoneD: document.getElementById('zone-defense'),
                statusP: document.getElementById('prosecutor-status'),
                statusD: document.getElementById('defense-status'),
                labelP: document.getElementById('label-prosecutor'),
                labelD: document.getElementById('label-defense'),
                centerDisplay: document.getElementById('center-display'),
                argCounter: document.getElementById('argument-counter'),
                progressBar: document.getElementById('progress-bar'),
                judgeGavel: document.getElementById('judge-gavel')
            },

            leaveRoom: function() {
                if(confirm("Are you sure you want to leave the courtroom?")) window.location.reload(); 
            },

            joinGame: async function() {
                const codeInput = document.getElementById('room-code').value;
                this.myRole = document.getElementById('player-role').value;
                
                this.ui.chat.innerHTML = '<div class="text-center mt-2"><span class="bg-gray-800 border border-gray-700 text-court-gold text-[10px] uppercase tracking-widest px-3 py-1 rounded-full">Court is now in session</span></div>';
                this.argumentCount = 0;
                this.updateProgress();
                
                let rawName = document.getElementById('player-name').value.trim();
                if(!rawName) rawName = "Lawyer"; 
                this.myName = "Adv. " + rawName;
                
                this.initSpeech();
                
                if(codeInput.length === 0) {
                    this.roomCode = Math.floor(10000 + Math.random() * 90000).toString();
                    await db.ref('courtrooms/' + this.roomCode).remove();
                    
                    const caseType = document.getElementById('case-type').value;
                    let dummyCaseDetails = {};
                    if(caseType === 'murder') {
                        dummyCaseDetails = { 
                            title: "The Silent Night Murder", 
                            police_report: "Victim found dead in a locked library. No murder weapon found. Suspect claims they were asleep.",
                            witnesses: ["Maid (Found body)", "Doctor (Autopsy)", "Lead Detective"]
                        };
                    } else if (caseType === 'fraud') {
                        dummyCaseDetails = { 
                            title: "Phantom Shares Fraud", 
                            police_report: "$10 Million vanished from accounts. Transferred to offshore shell companies. CEO is the primary suspect.",
                            witnesses: ["Chief Financial Officer", "IT Admin", "Whistleblower"]
                        };
                    } else {
                        dummyCaseDetails = { 
                            title: "The Digital Heist", 
                            police_report: "Bank server hacked at 2 AM. $5M stolen. Server Admin arrested due to IP log matches.",
                            witnesses: ["Bank Manager", "Cyber Security Expert", "Admin's Colleague"]
                        };
                    }
                    
                    // Added await to fix the sync issue
                    await db.ref('courtrooms/' + this.roomCode + '/case_details').set(dummyCaseDetails);
                    alert(`ROOM CREATED!\n\nYour Room Code is: ${this.roomCode}\nShare this 5-DIGIT code with your opponent.`);
                } else {
                    this.roomCode = codeInput;
                }
                
                if(this.myRole === 'Defense') {
                    this.ui.labelD.innerText = this.myName + ' (You)';
                    this.ui.labelP.innerText = 'Prosecutor (Waiting...)';
                } else {
                    this.ui.labelP.innerText = this.myName + ' (You)';
                    this.ui.labelD.innerText = 'Defense (Waiting...)';
                }

                db.ref('courtrooms/' + this.roomCode + '/players/' + this.myRole).set(this.myName);

                this.ui.lobby.classList.remove('active');
                this.ui.game.classList.add('active');
                this.updateTurnVisuals();
                this.initFirebase();
            },

            initFirebase: function() {
                // Use .on instead of .once for automatic sync
                db.ref('courtrooms/' + this.roomCode + '/case_details').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if(data) {
                        document.getElementById('modal-casetitle').innerText = data.title;
                        document.getElementById('modal-casereport').innerText = data.police_report;
                        
                        const wList = document.getElementById('witness-list');
                        wList.innerHTML = '';
                        if(data.witnesses) {
                            data.witnesses.forEach(w => {
                                wList.innerHTML += `<button onclick="gameApp.callWitness('${w}')" class="w-full bg-gray-800 hover:bg-gray-700 text-left px-4 py-3 mb-2 rounded text-sm font-bold text-white transition border-l-4 border-gray-600 hover:border-court-gold">${w}</button>`;
                            });
                        }
                    } else {
                        document.getElementById('modal-casetitle').innerText = "Case Not Found";
                        document.getElementById('modal-casereport').innerText = "Please verify your room code or host a new game.";
                        document.getElementById('witness-list').innerHTML = "<p class='text-red-400 text-center'>No witnesses available.</p>";
                    }
                });

                db.ref('courtrooms/' + this.roomCode + '/players').on('value', (snapshot) => {
                    const players = snapshot.val();
                    if(players) {
                        if(this.myRole === 'Defense' && players.Prosecutor) this.ui.labelP.innerText = players.Prosecutor + ' (Opponent)';
                        else if(this.myRole === 'Prosecutor' && players.Defense) this.ui.labelD.innerText = players.Defense + ' (Opponent)';
                    }
                });

                db.ref('courtrooms/' + this.roomCode + '/witnessOnStand').on('value', (snapshot) => {
                    const w = snapshot.val();
                    if(w) {
                        this.ui.centerDisplay.innerHTML = `
                            <div class="bg-gray-800 border border-court-gold px-2 py-1 rounded text-center shadow-lg animate-fade-in">
                                <p class="text-[8px] text-gray-400 uppercase">On Stand</p>
                                <p class="text-[10px] font-bold text-white">${w}</p>
                            </div>
                        `;
                    }
                });

                db.ref('courtrooms/' + this.roomCode + '/arguments').on('child_added', (snapshot) => {
                    const msg = snapshot.val();
                    
                    if(msg.role === 'System') {
                        this.appendSystemMsg(msg.text);
                    } else if (msg.role === 'Judge') {
                        this.appendJudgeMsg(msg.text);
                    } else {
                        this.argumentCount++;
                        this.updateProgress();
                        
                        const senderName = msg.name || `Adv. ${msg.role}`;
                        this.appendDialog(msg.role, senderName, msg.text);
                        
                        this.currentTurn = msg.role === 'Defense' ? 'Prosecutor' : 'Defense';
                        this.updateTurnVisuals();

                        if(this.argumentCount >= this.maxArguments && this.currentTurn === this.myRole) {
                            setTimeout(() => this.callVerdict(), 1000);
                        }
                    }
                });
            },

            showCaseFile: function() { document.getElementById('modal-casefile').classList.replace('hidden', 'flex'); },
            showWitnesses: function() { document.getElementById('modal-witnesses').classList.replace('hidden', 'flex'); },
            closeModals: function() {
                document.getElementById('modal-casefile').classList.replace('flex', 'hidden');
                document.getElementById('modal-witnesses').classList.replace('flex', 'hidden');
            },

            callWitness: function(witnessName) {
                if(this.currentTurn !== this.myRole) return alert("You can only call a witness during your turn!");
                this.closeModals();
                db.ref('courtrooms/' + this.roomCode + '/witnessOnStand').set(witnessName);
                db.ref('courtrooms/' + this.roomCode + '/arguments').push({
                    role: 'System', text: `${this.myName} calls ${witnessName} to the witness stand for cross-examination.`, timestamp: Date.now()
                });
            },

            updateProgress: function() {
                this.ui.argCounter.innerText = `Arguments: ${this.argumentCount} / ${this.maxArguments} until Verdict`;
                let percentage = (this.argumentCount / this.maxArguments) * 100;
                if(percentage > 100) percentage = 100;
                this.ui.progressBar.style.width = percentage + '%';
            },

            callVerdict: function() {
                this.currentTurn = 'Judge'; 
                this.updateTurnVisuals();
                this.ui.input.placeholder = "Awaiting Final Verdict...";
                this.ui.judgeGavel.classList.add('animate-gavel-strike');
                setTimeout(() => this.ui.judgeGavel.classList.remove('animate-gavel-strike'), 600);

                if(this.myRole === 'Prosecutor') { 
                    db.ref('courtrooms/' + this.roomCode + '/arguments').push({ role: 'System', text: "All arguments concluded. The AI Judge is reviewing the case...", timestamp: Date.now() });
                    setTimeout(() => {
                        db.ref('courtrooms/' + this.roomCode + '/arguments').push({ role: 'Judge', text: "Based on the presented arguments and witness cross-examinations, the Court finds in favor of the Prosecution. Case closed.", timestamp: Date.now() });
                    }, 3000);
                }
            },

            updateTurnVisuals: function() {
                if(this.currentTurn === 'Judge') {
                    this.ui.input.disabled = true; this.ui.sendBtn.disabled = true;
                    this.ui.zoneP.classList.replace('opacity-100', 'opacity-50');
                    this.ui.zoneD.classList.replace('opacity-100', 'opacity-50');
                    return;
                }

                const isMyTurn = this.currentTurn === this.myRole;
                this.ui.input.disabled = !isMyTurn;
                this.ui.sendBtn.disabled = !isMyTurn;
                
                if(isMyTurn) {
                    this.ui.input.placeholder = "Present your argument...";
                    this.ui.input.focus();
                } else {
                    this.ui.input.placeholder = "Waiting for opponent...";
                }

                if(this.currentTurn === 'Defense') {
                    this.ui.zoneD.classList.replace('opacity-50', 'opacity-100');
                    this.ui.zoneP.classList.replace('opacity-100', 'opacity-50');
                    this.ui.statusD.innerHTML = '<i class="fa-solid fa-microphone"></i> Speaking';
                    this.ui.statusP.innerText = 'Waiting...';
                } else {
                    this.ui.zoneP.classList.replace('opacity-50', 'opacity-100');
                    this.ui.zoneD.classList.replace('opacity-100', 'opacity-50');
                    this.ui.statusP.innerHTML = '<i class="fa-solid fa-microphone"></i> Speaking';
                    this.ui.statusD.innerText = 'Waiting...';
                }
            },

            sendArgument: function(e) {
                e.preventDefault();
                if(!this.ui.input.value.trim() || this.currentTurn !== this.myRole) return;
                const text = this.ui.input.value.trim();
                this.ui.input.value = '';
                db.ref('courtrooms/' + this.roomCode + '/arguments').push({ role: this.myRole, name: this.myName, text: text, timestamp: Date.now() });
            },

            appendDialog: function(role, playerName, text) {
                const wrapper = document.createElement('div');
                const isMe = role === this.myRole;
                
                const alignClass = isMe ? 'self-end' : 'self-start';
                const boxClass = isMe ? 'bg-blue-900 border-b-4 border-blue-500 rounded-tl-xl rounded-tr-xl rounded-bl-xl' : 'bg-red-900 border-b-4 border-red-500 rounded-tl-xl rounded-tr-xl rounded-br-xl';
                const labelColor = isMe ? 'text-blue-300 text-right' : 'text-red-300 text-left';
                
                wrapper.className = `flex flex-col w-[85%] ${alignClass} animate-slide-down`;
                wrapper.innerHTML = `
                    <span class="text-[9px] font-bold uppercase ${labelColor} mb-0.5 px-1">${playerName}</span>
                    <div class="${boxClass} text-sm font-sans text-white p-3 shadow-md leading-snug">
                        ${text}
                    </div>
                `;
                this.ui.chat.appendChild(wrapper);
                this.ui.chat.scrollTop = this.ui.chat.scrollHeight;
            },

            appendSystemMsg: function(text) {
                const wrapper = document.createElement('div');
                wrapper.className = "flex justify-center my-1 w-full animate-fade-in";
                wrapper.innerHTML = `<span class="bg-gray-800 text-gray-300 border border-gray-600 text-[10px] px-4 py-1 rounded-full text-center max-w-[90%] shadow-md"><i class="fa-solid fa-info-circle text-court-gold"></i> ${text}</span>`;
                this.ui.chat.appendChild(wrapper);
                this.ui.chat.scrollTop = this.ui.chat.scrollHeight;
            },

            appendJudgeMsg: function(text) {
                const wrapper = document.createElement('div');
                wrapper.className = "flex justify-center my-4 w-full animate-slide-down";
                wrapper.innerHTML = `
                    <div class="bg-gray-200 border-2 border-court-gold p-3 rounded text-center max-w-[90%] shadow-[0_5px_15px_rgba(0,0,0,0.5)]">
                        <p class="text-[10px] font-bold text-black uppercase tracking-widest mb-1"><i class="fa-solid fa-gavel text-court-gold"></i> OFFICIAL VERDICT</p>
                        <p class="text-sm text-gray-900 font-serif font-bold">${text}</p>
                    </div>
                `;
                this.ui.chat.appendChild(wrapper);
                this.ui.chat.scrollTop = this.ui.chat.scrollHeight;
            },

            initSpeech: function() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if(SpeechRecognition) {
                    this.recognition = new SpeechRecognition();
                    this.recognition.continuous = false;
                    this.recognition.interimResults = false;
                    this.recognition.onstart = () => {
                        this.isListening = true;
                        const micBtn = document.getElementById('mic-btn');
                        micBtn.classList.replace('text-gray-300', 'text-red-500');
                        micBtn.classList.add('animate-pulse');
                        this.ui.input.placeholder = "Listening...";
                    };
                    this.recognition.onresult = (event) => this.ui.input.value += (this.ui.input.value ? ' ' : '') + event.results[0][0].transcript;
                    this.recognition.onerror = () => this.resetMicUI();
                    this.recognition.onend = () => this.resetMicUI();
                }
            },
            toggleMic: function() {
                if(!this.recognition) return alert("Browser does not support Voice Typing.");
                if(this.isListening) this.recognition.stop();
                else {
                    this.recognition.lang = document.getElementById('voice-lang').value;
                    this.recognition.start();
                }
            },
            resetMicUI: function() {
                this.isListening = false;
                const micBtn = document.getElementById('mic-btn');
                micBtn.classList.replace('text-red-500', 'text-gray-300');
                micBtn.classList.remove('animate-pulse');
                this.ui.input.placeholder = this.currentTurn === this.myRole ? "Present your argument..." : "Waiting for opponent...";
            }
        };
    </script>
</body>
</html>
