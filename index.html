<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Virtual Courtroom</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #121212; color: white; font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        #game-screen { display: none; }
        #messages { height: 350px; border: 2px solid #333; overflow-y: scroll; padding: 15px; background: #000; text-align: left; border-radius: 10px;}
        .msg { margin: 10px 0; padding: 10px; border-radius: 8px; width: fit-content; max-width: 80%; }
        .msg.prosecutor { background: #331111; color: #ff6b6b; border: 1px solid #ff6b6b; margin-left: 0; }
        .msg.defense { background: #112233; color: #4dabf7; border: 1px solid #4dabf7; margin-left: auto; }
        input, button { padding: 12px; margin: 5px; border-radius: 5px; border: none; font-size: 16px; outline: none;}
        input { width: 60%; background: #222; color: white; border: 1px solid #555;}
        button { cursor: pointer; font-weight: bold; transition: 0.2s;}
        button:hover { opacity: 0.8; }
        .btn-blue { background: #4dabf7; color: #000; }
        .btn-red { background: #ff6b6b; color: #000; }
        .btn-judge { background: #d32f2f; color: white; width: 80%; margin-top: 20px; }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen">
        <h1 style="color: #4dabf7;">Virtual Courtroom AI</h1>
        <p>Select your role to start the game.</p>
        <br>
        <button class="btn-blue" onclick="hostNewRoom()">1. Host New Room (Prosecutor)</button>
        <button class="btn-red" onclick="joinExistingRoom()">2. Join Room (Defense)</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
        <h2 id="room-display" style="color: #4dabf7;">Court is in Session</h2>
        <div id="messages"></div>
        <input type="text" id="chat-input" placeholder="Type your objection or argument...">
        <button class="btn-blue" onclick="sendMessage()">Present</button>
        <br>
        <button class="btn-judge" onclick="callVerdict()">End Trial & Ask AI Judge</button>
    </div>

    <!-- Script File -->
    <script src="app.js"></script>
</body>
</html>
