<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Courtroom: AI Justice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                        comic: ['Bangers', 'cursive'],
                    },
                    colors: {
                        cyber: {
                            cyan: '#00e5ff',
                            blue: '#0044ff',
                            red: '#ff003c',
                            dark: '#050b14',
                            panel: '#0a192f',
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shake-hard': 'shakeHard 0.4s cubic-bezier(.36,.07,.19,.97) both',
                        'zoom-in-flash': 'zoomInFlash 0.5s ease-out forwards',
                        'slide-in-right': 'slideInRight 0.3s ease-out forwards',
                        'slide-in-left': 'slideInLeft 0.3s ease-out forwards',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { filter: 'drop-shadow(0 0 5px rgba(0, 229, 255, 0.5))' },
                            '50%': { filter: 'drop-shadow(0 0 20px rgba(0, 229, 255, 1))' }
                        },
                        shakeHard: {
                            '0%, 100%': { transform: 'translate3d(0, 0, 0)' },
                            '10%, 30%, 50%, 70%, 90%': { transform: 'translate3d(-10px, 10px, 0) rotate(-2deg)' },
                            '20%, 40%, 60%, 80%': { transform: 'translate3d(10px, -10px, 0) rotate(2deg)' }
                        },
                        zoomInFlash: {
                            '0%': { opacity: '0', transform: 'scale(0.1) rotate(-15deg)' },
                            '50%': { opacity: '1', transform: 'scale(1.2) rotate(5deg)', filter: 'brightness(2)' },
                            '100%': { opacity: '1', transform: 'scale(1) rotate(0deg)', filter: 'brightness(1)' }
                        },
                        slideInRight: {
                            '0%': { opacity: '0', transform: 'translateX(50px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' }
                        },
                        slideInLeft: {
                            '0%': { opacity: '0', transform: 'translateX(-50px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            height: 100dvh;
            background-color: #050b14;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,229,255,0.2);
            /* Cyberpunk grid background */
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 20;
        }

        /* High-tech Dialog Box styling */
        .cyber-dialog {
            background: rgba(10, 25, 47, 0.85);
            border: 1px solid #00e5ff;
            border-radius: 8px 24px 8px 8px;
            box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.2), 0 0 10px rgba(0, 229, 255, 0.1);
            position: relative;
            backdrop-filter: blur(4px);
        }
        .cyber-dialog::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 20px; height: 20px;
            border-top: 2px solid #00e5ff;
            border-left: 2px solid #00e5ff;
            border-radius: 8px 0 0 0;
        }
        .cyber-dialog.prosecutor {
            border-color: #ff003c;
            border-radius: 24px 8px 8px 8px;
            box-shadow: inset 0 0 10px rgba(255, 0, 60, 0.2), 0 0 10px rgba(255, 0, 60, 0.1);
        }
        .cyber-dialog.prosecutor::before {
            border-color: #ff003c;
            left: auto; right: -1px;
            border-left: none; border-right: 2px solid #ff003c;
            border-radius: 0 8px 0 0;
        }

        /* Hidden Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Character Portrait Filters to make photos look like game assets */
        .character-portrait {
            filter: contrast(1.2) saturate(1.1) brightness(0.9);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 100%);
        }

        /* Wooden Desk overlay */
        .wooden-desk {
            background: linear-gradient(to bottom, #4a2e15 0%, #2a1608 100%);
            border-top: 3px solid #6b4423;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="screen-lobby" class="screen active bg-cyber-dark items-center justify-center p-6">
            <div class="text-center animate-zoom-in-flash mb-10">
                <i class="fa-solid fa-scale-balanced text-6xl text-cyber-cyan animate-pulse-glow mb-4 block"></i>
                <h1 class="text-5xl font-comic tracking-wider text-transparent bg-clip-text bg-gradient-to-b from-white to-cyber-cyan drop-shadow-[0_0_10px_rgba(0,229,255,0.8)]" style="-webkit-text-stroke: 1px #00e5ff;">AI COURTROOM</h1>
                <p class="text-cyber-cyan tracking-[0.3em] uppercase text-sm mt-2 font-bold font-sans">The Digital Duel</p>
            </div>

            <div class="w-full max-w-sm space-y-6 bg-cyber-panel/80 p-6 rounded-xl border border-cyber-cyan/30 shadow-[0_0_20px_rgba(0,229,255,0.1)] backdrop-blur-md">
                <div>
                    <label class="block text-xs font-bold text-cyber-cyan uppercase tracking-wider mb-2">Room Code</label>
                    <input type="text" id="room-code" placeholder="ENTER 4 DIGITS" maxlength="4" class="w-full bg-black border-2 border-cyber-cyan/50 rounded p-3 text-center text-2xl font-bold tracking-[0.5em] text-white focus:outline-none focus:border-cyber-cyan focus:shadow-[0_0_15px_rgba(0,229,255,0.5)] transition-all uppercase">
                </div>
                <div>
                    <label class="block text-xs font-bold text-cyber-cyan uppercase tracking-wider mb-2">Select Side</label>
                    <select id="player-role" class="w-full bg-black border-2 border-cyber-cyan/50 rounded p-3 text-center text-lg font-bold text-white focus:outline-none focus:border-cyber-cyan appearance-none cursor-pointer">
                        <option value="Defense">DEFENSE (Blue)</option>
                        <option value="Prosecutor">PROSECUTOR (Red)</option>
                    </select>
                </div>
                <button onclick="gameApp.joinGame()" class="w-full bg-gradient-to-r from-cyber-blue to-cyber-cyan hover:from-cyber-cyan hover:to-white text-black font-black text-xl py-4 rounded shadow-[0_0_20px_rgba(0,229,255,0.6)] transition-all transform hover:scale-[1.02] active:scale-95 uppercase tracking-wider">
                    Enter Court
                </button>
            </div>
        </div>

        <div id="screen-game" class="screen flex flex-col h-full bg-black">
            
            <!-- SECTION 1: AI JUDGE (Top 30%) -->
            <div class="h-[28%] relative bg-[url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=600&auto=format&fit=crop')] bg-cover bg-center border-b-4 border-cyber-cyan">
                <!-- Overlay darkening -->
                <div class="absolute inset-0 bg-gradient-to-b from-black/80 via-cyber-dark/60 to-black/90"></div>
                
                <!-- Judge Entity -->
                <div class="absolute inset-0 flex flex-col items-center justify-end pb-4">
                    <!-- Glowing Scale Icon -->
                    <i class="fa-solid fa-scale-unbalanced text-3xl text-cyber-cyan animate-pulse-glow mb-2 drop-shadow-[0_0_10px_#00e5ff]"></i>
                    
                    <!-- Tech Judge Image Placeholder -->
                    <div class="relative w-24 h-24 rounded-full overflow-hidden border-2 border-cyber-cyan shadow-[0_0_20px_#00e5ff] z-10 mb-2">
                        <img src="https://images.unsplash.com/photo-1535223289827-42f1e9919769?q=80&w=200&auto=format&fit=crop" class="object-cover w-full h-full mix-blend-luminosity filter sepia-[0.5] hue-rotate-180" alt="AI Judge">
                        <div class="absolute inset-0 bg-cyber-cyan/20 animate-pulse"></div>
                    </div>
                    
                    <!-- Judge Label -->
                    <div class="bg-black/80 border border-cyber-cyan px-4 py-1 rounded text-xs font-bold text-cyber-cyan uppercase tracking-widest relative z-10 mb-3 shadow-[0_0_10px_#00e5ff]">
                        MILORD AI-7
                    </div>

                    <!-- Verdict Scale Meter -->
                    <div class="w-11/12 max-w-[300px] relative z-10">
                        <div class="flex justify-between text-[10px] font-bold uppercase mb-1 drop-shadow-md">
                            <span class="text-cyber-red">Prosecution</span>
                            <span class="text-cyber-cyan">Defense</span>
                        </div>
                        <div class="h-3 w-full bg-gray-900 rounded-full border border-gray-600 overflow-hidden relative shadow-[0_0_10px_rgba(255,255,255,0.1)]">
                            <!-- The Balance Bar -->
                            <div id="verdict-bar" class="absolute left-0 top-0 h-full w-[50%] bg-gradient-to-r from-cyber-red to-cyber-cyan transition-all duration-500 ease-out"></div>
                            <!-- Center Marker -->
                            <div class="absolute left-1/2 top-0 bottom-0 w-0.5 bg-white shadow-[0_0_5px_#fff] -ml-[1px]"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="h-[35%] relative flex border-b-2 border-gray-800 bg-cyber-panel overflow-hidden">
                <!-- VS Graphic Center -->
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-12 h-12 bg-black border-2 border-white rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(255,255,255,0.5)] transform -rotate-12 italic font-black text-2xl">
                    VS
                </div>

                <!-- Left: Prosecutor -->
                <div id="zone-prosecutor" class="w-1/2 relative bg-gradient-to-br from-red-950 to-black border-r-2 border-red-900/50 flex flex-col justify-end transition-opacity duration-300 opacity-50">
                    <div class="absolute top-2 left-2 z-20 flex flex-col gap-1">
                        <div class="bg-cyber-red text-black text-[10px] font-black px-2 py-0.5 uppercase border border-red-400 drop-shadow-[0_0_5px_#ff003c]">Prosecutor</div>
                        <div class="text-white text-xs font-bold drop-shadow-md" id="prosecutor-status">Waiting...</div>
                    </div>
                    
                    <!-- Portrait -->
                    <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=300&auto=format&fit=crop" class="character-portrait absolute bottom-[30px] left-0 h-[120%] object-cover object-top opacity-90" alt="Prosecutor">
                    
                    <!-- Desk Overlay -->
                    <div class="wooden-desk absolute bottom-0 left-0 w-full h-[40px] z-10"></div>
                </div>

                <!-- Right: Defense -->
                <div id="zone-defense" class="w-1/2 relative bg-gradient-to-bl from-cyan-950 to-black flex flex-col justify-end transition-opacity duration-300 opacity-100">
                    <div class="absolute top-2 right-2 z-20 flex flex-col gap-1 items-end">
                        <div class="bg-cyber-cyan text-black text-[10px] font-black px-2 py-0.5 uppercase border border-cyan-400 drop-shadow-[0_0_5px_#00e5ff]">Defense (You)</div>
                        <div class="text-white text-xs font-bold drop-shadow-md" id="defense-status"><i class="fa-solid fa-microphone text-green-400 animate-pulse"></i> Your Turn</div>
                    </div>
                    
                    <!-- Portrait (Flipped) -->
                    <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=300&auto=format&fit=crop" class="character-portrait absolute bottom-[30px] right-0 h-[120%] object-cover object-top opacity-90 transform -scale-x-100" alt="Defense">
                    
                    <!-- Desk Overlay -->
                    <div class="wooden-desk absolute bottom-0 right-0 w-full h-[40px] z-10"></div>
                </div>
            </div>

            <div class="h-[37%] flex flex-col relative bg-cyber-dark">
                
                <!-- Chat Log Area -->
                <div id="chat-container" class="flex-1 overflow-y-auto p-3 space-y-4 no-scrollbar pb-16">
                    <!-- System Message Example -->
                    <div class="text-center">
                        <span class="bg-black border border-gray-700 text-gray-400 text-[10px] uppercase tracking-widest px-3 py-1 rounded-full">Trial Commences</span>
                    </div>
                </div>

                <!-- Massive Objection Button -->
                <button onclick="gameApp.triggerObjection()" class="absolute -top-8 right-4 z-30 w-16 h-16 bg-gradient-to-br from-red-500 to-red-700 border-2 border-white rounded-full shadow-[0_0_20px_#ff003c,inset_0_0_10px_rgba(0,0,0,0.5)] flex items-center justify-center transform hover:scale-110 active:scale-90 transition-all font-comic text-white text-xl italic tracking-tighter overflow-hidden group">
                    <span class="absolute inset-0 bg-white opacity-0 group-hover:opacity-30 group-active:opacity-50 transition-opacity"></span>
                    <i class="fa-solid fa-hand-paper drop-shadow-md"></i>
                </button>

                <!-- Input Field Panel -->
                <div class="bg-cyber-panel/90 border-t border-cyber-cyan p-2 backdrop-blur-sm z-20">
                    <form id="argument-form" onsubmit="gameApp.sendArgument(event)" class="flex gap-2">
                        <input type="text" id="argument-input" placeholder="Type your argument..." class="flex-1 bg-black border border-gray-600 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-cyber-cyan focus:shadow-[0_0_10px_rgba(0,229,255,0.3)] transition-all font-sans font-medium" autocomplete="off">
                        <button type="submit" id="send-btn" class="bg-cyber-cyan text-black px-4 py-2 rounded font-bold uppercase tracking-wider active:scale-95 transition-transform hover:bg-white hover:shadow-[0_0_15px_#00e5ff]">
                            <i class="fa-solid fa-play"></i>
                        </button>
                    </form>
                </div>
            </div>

            <div id="objection-overlay" class="absolute inset-0 bg-red-900/40 z-50 hidden flex-col items-center justify-center pointer-events-none overflow-hidden">
                <!-- Speed lines background effect -->
                <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-transparent via-transparent to-red-900/80 animate-pulse"></div>
                
                <!-- The Comic Text Graphic -->
                <div id="objection-text" class="relative z-10 opacity-0 transform scale-0 font-comic text-7xl md:text-8xl italic font-black tracking-tighter text-white drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)]" style="-webkit-text-stroke: 3px #ff003c;">
                    OBJECTION!
                    <!-- Impact Star behind text -->
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full bg-yellow-400 rounded-[50%] blur-[20px] -z-10 mix-blend-overlay"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const gameApp = {
            roomCode: '',
            myRole: 'Defense', // Default
            currentTurn: 'Defense', // Tracks whose turn it is
            verdictScale: 50, // 0 = Prosecution wins, 100 = Defense wins
            
            // UI References
            ui: {
                lobby: document.getElementById('screen-lobby'),
                game: document.getElementById('screen-game'),
                chat: document.getElementById('chat-container'),
                input: document.getElementById('argument-input'),
                sendBtn: document.getElementById('send-btn'),
                bar: document.getElementById('verdict-bar'),
                zoneP: document.getElementById('zone-prosecutor'),
                zoneD: document.getElementById('zone-defense'),
                statusP: document.getElementById('prosecutor-status'),
                statusD: document.getElementById('defense-status'),
                objOverlay: document.getElementById('objection-overlay'),
                objText: document.getElementById('objection-text')
            },

            // --- 1. Game Flow & Navigation ---
            
            joinGame: function() {
                const codeInput = document.getElementById('room-code').value;
                if(codeInput.length < 4) {
                    document.getElementById('room-code').classList.add('animate-shake-hard', 'border-cyber-red');
                    setTimeout(() => document.getElementById('room-code').classList.remove('animate-shake-hard', 'border-cyber-red'), 400);
                    return;
                }
                
                this.roomCode = codeInput;
                this.myRole = document.getElementById('player-role').value;
                
                // Set initial visual state based on role selection
                if(this.myRole === 'Defense') {
                    this.ui.zoneD.querySelector('.bg-cyber-cyan').innerText = 'Defense (You)';
                    this.ui.zoneP.querySelector('.bg-cyber-red').innerText = 'Prosecutor (Opponent)';
                } else {
                    this.ui.zoneP.querySelector('.bg-cyber-red').innerText = 'Prosecutor (You)';
                    this.ui.zoneD.querySelector('.bg-cyber-cyan').innerText = 'Defense (Opponent)';
                }

                // Setup Firebase placeholders here
                this.initFirebasePlaceholder();

                // Transition screen
                this.ui.lobby.classList.remove('active');
                this.ui.game.classList.add('active');
                
                this.updateTurnVisuals();
                this.appendDialog('judge', 'Trial has commenced. Defense, state your opening argument.');
            },

            // --- 2. Dramatic Visuals & Animations ---

            updateTurnVisuals: function() {
                const isMyTurn = this.currentTurn === this.myRole;
                
                // Toggle input state
                this.ui.input.disabled = !isMyTurn;
                this.ui.sendBtn.disabled = !isMyTurn;
                if(isMyTurn) {
                    this.ui.input.placeholder = "Type your argument...";
                    this.ui.input.focus();
                } else {
                    this.ui.input.placeholder = "Waiting for opponent...";
                }

                // Spotlight effect (opacity) and labels
                if(this.currentTurn === 'Defense') {
                    this.ui.zoneD.classList.replace('opacity-50', 'opacity-100');
                    this.ui.zoneP.classList.replace('opacity-100', 'opacity-50');
                    this.ui.statusD.innerHTML = '<i class="fa-solid fa-microphone text-green-400 animate-pulse"></i> Speaking';
                    this.ui.statusP.innerText = 'Waiting...';
                } else {
                    this.ui.zoneP.classList.replace('opacity-50', 'opacity-100');
                    this.ui.zoneD.classList.replace('opacity-100', 'opacity-50');
                    this.ui.statusP.innerHTML = '<i class="fa-solid fa-microphone text-green-400 animate-pulse"></i> Speaking';
                    this.ui.statusD.innerText = 'Waiting...';
                }
            },

            triggerObjection: function() {
                // If it's not your turn, an objection interrupts!
                
                // Visual Flash
                this.ui.objOverlay.classList.remove('hidden');
                this.ui.objOverlay.classList.add('flex', 'animate-shake-hard');
                
                // Text scale pop
                this.ui.objText.classList.remove('opacity-0', 'scale-0');
                this.ui.objText.classList.add('animate-zoom-in-flash');

                // Vibrate if mobile
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

                setTimeout(() => {
                    this.ui.objOverlay.classList.add('hidden');
                    this.ui.objOverlay.classList.remove('flex', 'animate-shake-hard');
                    this.ui.objText.classList.add('opacity-0', 'scale-0');
                    this.ui.objText.classList.remove('animate-zoom-in-flash');
                    
                    // Send objection message to chat
                    this.appendDialog(this.myRole, "OBJECTION!", true);
                    
                    // Force turn steal (Gameplay mechanic)
                    this.currentTurn = this.myRole;
                    this.updateTurnVisuals();
                    this.ui.input.placeholder = "State your reason for objection...";
                    
                }, 1200);
            },

            // --- 3. Chat & Dialog Logic ---

            sendArgument: function(e) {
                e.preventDefault();
                if(!this.ui.input.value.trim() || this.currentTurn !== this.myRole) return;
                
                const text = this.ui.input.value.trim();
                
                /* 
                 * REAL FIREBASE IMPLEMENTATION GOES HERE
                 * db.ref('rooms/' + this.roomCode + '/messages').push({ role: this.myRole, text: text });
                 */
                
                // Simulate sending (Local UI update)
                this.appendDialog(this.myRole, text, false);
                this.ui.input.value = '';

                // Simulate turn pass
                this.currentTurn = this.myRole === 'Defense' ? 'Prosecutor' : 'Defense';
                this.updateTurnVisuals();
                
                // AI/Opponent Simulation (For standalone testing without a friend)
                this.simulateOpponentAndJudge();
            },

            appendDialog: function(role, text, isObjection = false) {
                const wrapper = document.createElement('div');
                
                if(role === 'judge') {
                    wrapper.className = "flex justify-center my-2 animate-slide-in-right";
                    wrapper.innerHTML = `
                        <div class="bg-black/60 border border-cyber-cyan px-4 py-2 rounded text-center max-w-[80%] shadow-[0_0_15px_rgba(0,229,255,0.2)]">
                            <p class="text-xs font-bold text-cyber-cyan uppercase tracking-widest mb-1"><i class="fa-solid fa-gavel"></i> AI Judge</p>
                            <p class="text-sm text-gray-200 font-medium">${text}</p>
                        </div>
                    `;
                } else {
                    const isProsecutor = role === 'Prosecutor';
                    const isMe = role === this.myRole;
                    const alignClass = isMe ? (this.myRole === 'Prosecutor' ? 'self-start' : 'self-end') : (role === 'Prosecutor' ? 'self-start' : 'self-end');
                    const animationClass = role === 'Prosecutor' ? 'animate-slide-in-left' : 'animate-slide-in-right';
                    const boxClass = isProsecutor ? 'cyber-dialog prosecutor' : 'cyber-dialog';
                    const textColor = isProsecutor ? 'text-cyber-red' : 'text-cyber-cyan';
                    
                    let content = text;
                    if(isObjection) {
                        content = `<span class="font-comic text-2xl tracking-wide uppercase" style="color: ${isProsecutor ? '#ff003c' : '#00e5ff'}; text-shadow: 2px 2px 0px #000;">${text}</span>`;
                    }

                    wrapper.className = `flex flex-col w-[85%] ${alignClass} ${animationClass} mb-2`;
                    wrapper.innerHTML = `
                        <span class="text-[10px] font-bold uppercase ${textColor} mb-1 px-1 drop-shadow-md">${role} ${isMe ? '(You)' : ''}</span>
                        <div class="${boxClass} p-3 text-sm text-white font-medium leading-snug">
                            ${content}
                        </div>
                    `;
                }

                this.ui.chat.appendChild(wrapper);
                this.ui.chat.scrollTop = this.ui.chat.scrollHeight;
            },

            // --- 4. Meter & API Simulators ---

            updateScale: function(defenseValue) {
                // defenseValue: 0 (Full Prosecutor) to 100 (Full Defense)
                this.verdictScale = Math.max(0, Math.min(100, defenseValue));
                this.ui.bar.style.width = `${this.verdictScale}%`;
                
                // Add shake effect to judge screen on major shifts
                this.ui.bar.parentElement.classList.add('animate-pulse-glow');
                setTimeout(() => this.ui.bar.parentElement.classList.remove('animate-pulse-glow'), 1000);
            },

            initFirebasePlaceholder: function() {
                // This is where you would place the Firebase .on('child_added') listener
                console.log(`[System] Connected to Room: ${this.roomCode} as ${this.myRole}`);
            },

            simulateOpponentAndJudge: function() {
                // SIMULATION LOGIC FOR DEMO PURPOSES
                setTimeout(() => {
                    const oppRole = this.myRole === 'Defense' ? 'Prosecutor' : 'Defense';
                    this.appendDialog(oppRole, "The evidence clearly contradicts that statement!");
                    
                    // Simulate Judge reacting and changing meter
                    setTimeout(() => {
                        this.appendDialog('judge', "The prosecution makes a valid point. Updating verdict scale.");
                        // Shift scale randomly
                        let newScale = this.myRole === 'Defense' ? this.verdictScale - 15 : this.verdictScale + 15;
                        this.updateScale(newScale);

                        // Return turn
                        this.currentTurn = this.myRole;
                        this.updateTurnVisuals();

                        /* 
                         * REAL GEMINI API IMPLEMENTATION GOES HERE
                         * Construct prompt with chat history and fetch from backend.
                         */
                    }, 1500);
                }, 2000);
            }
        };
    </script>
